name: Jathagam tests

on:
  push:
    paths: ['jathagam-src/**', 'jathagam/**', '.github/workflows/jathagam-test.yml']
  pull_request:
    paths: ['jathagam-src/**', 'jathagam/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jathagam-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check committed build is up to date
        run: |
          npm run build
          git diff --stat --exit-code -- ../jathagam || (echo "Run 'npm run build' in jathagam-src and commit ../jathagam" && exit 1)
